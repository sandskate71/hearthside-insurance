<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Nashville Insurance Advisors</title>

  <!-- Navy background -->
  <rect width="1200" height="630" fill="#0F2044"/>

  <!-- Subtle vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F2044" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060f26" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!--
    Nashville skyline — FinalSkyline geometry
    Scaled to 900px wide: scale = 900/600 = 1.5
    Centered: x_offset = (1200-900)/2 = 150
    Vertically centered block: skyline top at y=142
  -->
  <g transform="translate(150,142) scale(1.5)" fill="#C9A84C">
    <rect x="0" y="92" width="38" height="28"/>
    <rect x="42" y="80" width="32" height="40"/>
    <rect x="50" y="74" width="6" height="6"/>
    <rect x="80" y="60" width="42" height="60"/>
    <rect x="86" y="52" width="30" height="8"/>
    <rect x="98" y="44" width="6" height="8"/>
    <rect x="130" y="48" width="20" height="72"/>
    <polygon points="140,22 136,48 144,48"/>
    <rect x="139" y="10" width="2" height="14"/>
    <rect x="178" y="38" width="22" height="82"/>
    <rect x="226" y="38" width="22" height="82"/>
    <rect x="178" y="32" width="70" height="6"/>
    <polygon points="178,32 248,32 213,8"/>
    <polygon points="176,32 180,32 178,-26"/>
    <rect x="177.4" y="-28" width="1.2" height="3"/>
    <polygon points="246,32 250,32 248,-26"/>
    <rect x="247.4" y="-28" width="1.2" height="3"/>
    <rect x="172" y="116" width="84" height="4"/>
    <rect x="270" y="56" width="36" height="64"/>
    <rect x="276" y="50" width="24" height="6"/>
    <rect x="312" y="74" width="28" height="46"/>
    <rect x="348" y="26" width="34" height="94"/>
    <rect x="363" y="10" width="4" height="16"/>
    <rect x="390" y="56" width="28" height="64"/>
    <rect x="396" y="46" width="16" height="10"/>
    <rect x="424" y="82" width="28" height="38"/>
    <rect x="458" y="50" width="32" height="70"/>
    <polygon points="458,50 474,34 490,50"/>
    <rect x="496" y="42" width="18" height="78"/>
    <rect x="520" y="72" width="26" height="48"/>
    <rect x="550" y="84" width="22" height="36"/>
    <rect x="576" y="94" width="24" height="26"/>
  </g>

  <!-- Hairline rule (skyline bottom y=142+180=322, gap 24 → y=346) -->
  <rect x="150" y="346" width="900" height="1" fill="#C9A84C" fill-opacity="0.45"/>

  <!-- "Nashville Insurance Advisors" (gap 24 → y=371) -->
  <text
    x="600" y="371"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="64" font-weight="600"
    fill="#F5F1E8"
    text-anchor="middle"
    dominant-baseline="hanging"
  >Nashville Insurance Advisors</text>

  <!-- Subtext (text bottom 371+64=435, gap 16 → y=451) -->
  <text
    x="600" y="451"
    font-family="Arial, system-ui, sans-serif"
    font-size="28" font-weight="400" letter-spacing="0.04em"
    fill="#C9A84C"
    text-anchor="middle"
    dominant-baseline="hanging"
  >Independent Insurance Advisory · Nashville, TN</text>
</svg>
