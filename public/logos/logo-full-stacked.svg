    <rect x="47" y="4" width="13" height="58" rx="2.5" fill="white"/>
    <polygon points="4,4 17,4 60,62 60,58 47,58 4,8" fill="white"/>
    <g transform="translate(0, -50) scale(0.555, 0.9)">
