<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy background -->
  <rect width="1200" height="630" fill="#0F2044"/>

  <!-- Subtle grid texture lines -->
  <line x1="0" y1="630" x2="400" y2="0" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="200" y1="630" x2="600" y2="0" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="630" x2="800" y2="0" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="630" x2="1000" y2="0" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="630" x2="1200" y2="0" stroke="white" stroke-opacity="0.03" stroke-width="1"/>

  <!-- N mark — centered left block, scaled up -->
  <g transform="translate(120, 140) scale(3.2)">
    <rect x="4" y="4" width="13" height="58" rx="2.5" fill="white"/>
    <rect x="47" y="4" width="13" height="58" rx="2.5" fill="white"/>
    <polygon points="4,4 17,4 60,62 60,58 47,58 4,8" fill="white"/>
    <g transform="translate(0, -50) scale(0.555, 0.9)">
      <path d="M4,138 C4,136 8,133 30,132 C55,130 80,130 108,132 C116,133 118,136 116,138 C116,140 112,142 108,141 C80,139 55,139 30,141 C8,142 4,140 4,138Z" fill="#C9A84C"/>
    </g>
  </g>

  <!-- Vertical gold rule separator -->
  <rect x="430" y="120" width="2" height="390" fill="#C9A84C" opacity="0.4"/>

  <!-- Wordmark block -->
  <text x="480" y="255" font-family="Georgia, serif" font-weight="700" font-size="64" fill="white" letter-spacing="2">Nashville</text>
  <text x="480" y="335" font-family="Georgia, serif" font-weight="700" font-size="64" fill="white" letter-spacing="2">Insurance</text>
  <text x="480" y="415" font-family="Georgia, serif" font-weight="700" font-size="64" fill="white" letter-spacing="2">Advisors</text>

  <!-- Tagline -->
  <text x="480" y="475" font-family="Georgia, serif" font-weight="400" font-style="italic" font-size="26" fill="#C9A84C" letter-spacing="1">We don't shop rates. We review lives.</text>

  <!-- Bottom gold accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="#C9A84C"/>
</svg>
